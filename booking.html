<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ვიზიტის დაჯავშნა - ProAuto</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #ff334b; 
            --primary-glow: rgba(255, 51, 75, 0.3);
            --dark: #0a0a0a; 
            --surface: rgba(20, 20, 20, 0.85);
            --border: rgba(255, 255, 255, 0.1); 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Outfit', sans-serif; background: var(--dark); color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* ჰედერი */
        .header { 
            background: rgba(10, 10, 10, 0.85); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid var(--border); 
            padding: 18px 0; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            z-index: 1000; 
        }
        .nav-container { max-width: 1280px; margin: 0 auto; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; }
        
        .logo { font-size: 22px; font-weight: 700; color: #fff; text-decoration: none; }
        .logo span { color: var(--primary); }
        
        .back-link { 
            color: #b0b0b0; 
            text-decoration: none; 
            font-size: 14px; 
            font-weight: 500; 
            transition: color 0.2s ease; 
        }
        .back-link:hover { color: #fff; }

        /* ფორმის სექცია */
        .booking-section { 
            flex: 1;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 120px 20px 60px; 
        }
        .booking-wrapper { 
            width: 100%; 
            max-width: 460px; 
            background: var(--surface); 
            border: 1px solid var(--border); 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.7); 
            backdrop-filter: blur(12px);
        }
        .booking-wrapper h2 { margin: 0 0 8px; font-size: 26px; font-weight: 700; text-align: center; }
        .booking-wrapper p { color: #aaa; font-size: 14px; text-align: center; margin-bottom: 30px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 500; color: #ccc; }
        .form-group input, .form-group select { 
            width: 100%; 
            padding: 14px 16px; 
            border-radius: 10px; 
            border: 1px solid var(--border); 
            background: rgba(15, 15, 15, 0.9); 
            color: #fff; 
            font-size: 14px; 
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s ease;
        }
        .form-group input:focus, .form-group select:focus { 
            outline: none; 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        
        .btn-submit { 
            width: 100%; 
            padding: 15px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.25s ease; 
            margin-top: 10px;
            box-shadow: 0 6px 20px var(--primary-glow);
        }
        .btn-submit:hover { background: #e0283c; transform: translateY(-1px); }
    </style>
</head>
<body>

    <!-- ჰედერი -->
    <header class="header">
        <div class="nav-container">
            <a href="index.html" class="logo">Pro<span>Auto</span></a>
            <a href="index.html" class="back-link">← მთავარ გვერდზე დაბრუნება</a>
        </div>
    </header>

    <!-- ჯავშნის ფორმა ცალკე გვერდზე -->
    <section class="booking-section">
        <div class="booking-wrapper">
            <h2>ვიზიტის დაჯავშნა</h2>
            <p>შეავსეთ ფორმა და ჩვენი გუნდი უმოკლეს დროში დაგიკავშირდებათ.</p>
            
            <form id="bookingForm" action="https://script.google.com/macros/s/AKfycbwUQM4EGdLgNk3-YTHhPIgJ07dxPgCjBah5exVzeZOqwvK7X1xJml3PFXttoFtgfwbk/exec" method="POST">
                <div class="form-group">
                    <label>სახელი</label>
                    <input type="text" name="name" placeholder="თქვენი სახელი" required>
                </div>
                <div class="form-group">
                    <label>ტელეფონის ნომერი</label>
                    <input type="tel" name="phone" placeholder="+995 5XX XX XX XX" required>
                </div>
                <div class="form-group">
                    <label>მანქანის მოდელი</label>
                    <input type="text" name="car" placeholder="მაგ: BMW F30 320" required>
                </div>
                <div class="form-group">
                    <label>სასურველი სერვისი / პროდუქტი</label>
                    <select name="service" required>
                        <option value="" disabled selected>აირჩიეთ სერვისი</option>
                        <option value="ზეთის შეცვლა">ზეთის შეცვლა</option>
                        <option value="ხუნდების შეცვლა">ხუნდების შეცვლა</option>
                        <option value="ზეთი + ხუნდები">ზეთი + ხუნდები</option>
                        <option value="დიაგნოსტიკა">დიაგნოსტიკა</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">ჯავშნის გაგზავნა</button>
            </form>
        </div>
    </section>

</body>
</html>
